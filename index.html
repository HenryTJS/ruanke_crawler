<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国高校数据可视化平台</title>
<!-- ECharts CDN -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
  }
  .header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .header .stats {
    display: flex; gap: 30px; text-align: center;
  }
  .header .stats .num { font-size: 26px; font-weight: 700; }
  .header .stats .label { font-size: 12px; opacity: 0.85; }

  .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }

  /* 筛选器 */
  .filter-bar {
    background: #fff;
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .filter-row {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;
  }
  .filter-item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .filter-item label {
    font-size: 13px; color: #666; font-weight: 600;
  }
  .filter-item input {
    padding: 8px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    font-size: 14px;
    min-width: 200px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-item input:focus {
    border-color: #2a5298;
  }
  /* 平铺多选选项组件 */
  .ms-options {
    display: flex; flex-wrap: wrap; gap: 2px 6px;
    max-width: 100%;
  }
  .ms-opt {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 13px;
    color: #444;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }
  .ms-opt:hover { color: #2a5298; }
  .ms-opt input[type="checkbox"] {
    width: 11px; height: 11px; min-width: 11px; cursor: pointer; margin: 0; flex-shrink: 0;
  }
  .ms-opt.ms-checked { color: #2a5298; font-weight: 600; }
  .ms-opt.ms-all { color: #2a5298; font-weight: 600; }
  .ms-empty { font-size: 13px; color: #999; padding: 4px 0; }
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn-primary { background: #2a5298; color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-reset { background: #f0f0f0; color: #555; }
  .btn-reset:hover { background: #e0e0e0; }
  .filter-actions { display: flex; gap: 10px; margin-left: auto; }

  /* 图表区域 */
  .charts-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card h3 {
    font-size: 16px; color: #1e3c72;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0f0f0;
  }
  #mapChart { width: 100%; height: 520px; }
  #barChart { width: 100%; height: 250px; }
  #pieChart { width: 100%; height: 250px; }

  /* 列表 */
  .list-card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .list-header h3 { font-size: 16px; color: #1e3c72; }
  .list-header .count { font-size: 13px; color: #888; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f7f8fa;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    color: #555;
    border-bottom: 2px solid #e8e8e8;
    position: sticky; top: 0;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    vertical-align: middle;
  }
  tbody tr:hover { background: #f5f8ff; cursor: pointer; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-right: 4px;
    background: #e6f0ff;
    color: #2a5298;
  }
  .tag-985 { background: #fff1e6; color: #d46b08; }
  .tag-211 { background: #e6fffb; color: #08979c; }
  .tag-syl { background: #f9f0ff; color: #722ed1; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    background: #f0f0f0;
    color: #555;
  }
  .list-wrapper { max-height: 600px; overflow-y: auto; }

  /* 详情弹窗 */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 90%;
    max-width: 760px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 28px;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .modal-close {
    position: absolute; top: 14px; right: 18px;
    font-size: 24px; cursor: pointer; color: #999;
    background: none; border: none;
  }
  .modal-close:hover { color: #333; }
  .modal h2 { font-size: 22px; color: #1e3c72; margin-bottom: 4px; }
  .modal .en-name { color: #888; font-size: 14px; margin-bottom: 14px; }
  .modal .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .modal .meta .badge { font-size: 13px; padding: 4px 10px; }
  .modal .section { margin-bottom: 16px; }
  .modal .section h4 {
    font-size: 15px; color: #2a5298;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid #f0f0f0;
  }
  .modal .section p { font-size: 14px; line-height: 1.8; color: #444; white-space: pre-wrap; }
  .modal .contact { font-size: 14px; color: #555; line-height: 1.9; }
  .modal .contact span { margin-right: 20px; }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 12px; text-align: center; }
    .filter-actions { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎓 中国高校数据可视化平台</h1>
    <div class="sub">基于 output.csv 数据 · 支持多维筛选与地图统计</div>
  </div>
  <div class="stats">
    <div><div class="num" id="statTotal">0</div><div class="label">高校总数</div></div>
    <div><div class="num" id="statProv">0</div><div class="label">覆盖省份</div></div>
    <div><div class="num" id="statShown">0</div><div class="label">当前显示</div></div>
  </div>
</div>

<div class="container">
  <!-- 筛选器 -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-item">
        <label>省份</label>
        <div class="ms-options" id="msProvince"></div>
      </div>
      <div class="filter-item">
        <label>学校类别</label>
        <div class="ms-options" id="msCategory"></div>
      </div>
      <div class="filter-item">
        <label>层次</label>
        <div class="ms-options" id="msLevel"></div>
      </div>
      <div class="filter-item">
        <label>主管部门</label>
        <div class="ms-options" id="msAdmin"></div>
      </div>
      <div class="filter-item">
        <label>标签</label>
        <div class="ms-options" id="msTag"></div>
      </div>
      <div class="filter-item">
        <label>关键词搜索</label>
        <input type="text" id="filterKeyword" placeholder="输入学校名称搜索...">
      </div>
      <div class="filter-actions">
        <button class="btn btn-reset" onclick="resetFilters()">重置</button>
      </div>
    </div>
  </div>

  <!-- 图表 -->
  <div class="charts-grid">
    <div class="card">
      <h3>🗺️ 各省高校数量分布（点击省份可筛选）</h3>
      <div id="mapChart"></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:20px;">
        <h3>📊 高校数量 Top 10 省份</h3>
        <div id="barChart"></div>
      </div>
      <div class="card">
        <h3>🥧 学校类别占比</h3>
        <div id="pieChart"></div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="list-card">
    <div class="list-header">
      <h3>🏫 高校列表</h3>
      <div class="count">共 <span id="listCount">0</span> 所</div>
    </div>
    <div class="list-wrapper">
      <table>
        <thead>
          <tr>
            <th>学校名称</th>
            <th>省份</th>
            <th>城市</th>
            <th>类别</th>
            <th>层次</th>
            <th>标签</th>
          </tr>
        </thead>
        <tbody id="univTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2 id="mName"></h2>
    <div class="en-name" id="mEnName"></div>
    <div class="meta" id="mMeta"></div>
    <div class="contact" id="mContact"></div>
    <div class="section">
      <h4>🏠 校园环境</h4>
      <p id="mInds"></p>
    </div>
    <div class="section">
      <h4>📖 学校介绍</h4>
      <p id="mReason"></p>
    </div>
  </div>
</div>

<script src="china_map.js"></script>
<script src="data.js"></script>
<script>
// ============ 全局状态 ============
var allData = UNIV_DATA || [];
// 每个筛选维度对应一个数组（多选），空数组表示不筛选
var filters = {
  province: [],
  category: [],
  level: [],
  admin: [],
  tag: [],
  keyword: ''
};
var mapChart, barChart, pieChart;

// 筛选维度配置：ms-wrap id -> filters 中的键名
var MS_KEYS = {
  msProvince: 'province',
  msCategory: 'category',
  msLevel: 'level',
  msAdmin: 'admin',
  msTag: 'tag'
};

// ============ 初始化 ============
function init() {
  // 构建平铺多选选项
  renderMultiSelect('msProvince', 'province', unique(allData.map(d => d.provinceShort)).filter(Boolean).sort());
  renderMultiSelect('msCategory', 'category', unique(allData.map(d => d.categoryName)).filter(Boolean));
  renderMultiSelect('msLevel', 'level', unique(allData.map(d => d.level)).filter(Boolean));
  renderMultiSelect('msAdmin', 'admin', unique(allData.map(d => d.adminType)).filter(Boolean));

  // 标签选项（从 tags 字段解析）
  var tagSet = new Set();
  allData.forEach(d => {
    parseTags(d.tags).forEach(t => tagSet.add(t));
  });
  renderMultiSelect('msTag', 'tag', Array.from(tagSet));

  document.getElementById('filterKeyword').addEventListener('input', function() {
    filters.keyword = this.value.trim();
    applyFilters();
  });

  // 注册中国地图（使用本地 GeoJSON，避免 CDN 失效）
  if (typeof CHINA_GEOJSON !== 'undefined') {
    echarts.registerMap('china', CHINA_GEOJSON);
  }

  // 初始化图表
  mapChart = echarts.init(document.getElementById('mapChart'));
  barChart = echarts.init(document.getElementById('barChart'));
  pieChart = echarts.init(document.getElementById('pieChart'));
  window.addEventListener('resize', function() {
    mapChart.resize(); barChart.resize(); pieChart.resize();
  });

  // 统计头部
  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statProv').textContent = unique(allData.map(d => d.provinceShort)).filter(Boolean).length;

  applyFilters();
}

function unique(arr) { return Array.from(new Set(arr)); }

// ============ 平铺多选组件 ============
// 将一组选项平铺渲染到 wrapId 容器中，支持多选，勾选即应用筛选
function renderMultiSelect(wrapId, key, options) {
  var wrap = document.getElementById(wrapId);
  var selected = filters[key] || [];
  wrap.innerHTML = '';

  // 全选选项
  var allOpt = document.createElement('div');
  allOpt.className = 'ms-opt ms-all' + (selected.length === 0 ? ' ms-checked' : '');
  var allChk = document.createElement('input');
  allChk.type = 'checkbox';
  allChk.checked = (selected.length === 0);
  allOpt.appendChild(allChk);
  var allLabel = document.createElement('span');
  allLabel.textContent = '全选';
  allOpt.appendChild(allLabel);
  allOpt.addEventListener('click', function(e) {
    if (e.target !== allChk) allChk.checked = !allChk.checked;
    filters[key] = [];
    renderMultiSelect(wrapId, key, options);
    applyFilters();
  });
  wrap.appendChild(allOpt);

  // 各选项
  options.forEach(function(opt) {
    var isSel = (selected.indexOf(opt) !== -1);
    var optEl = document.createElement('div');
    optEl.className = 'ms-opt' + (isSel ? ' ms-checked' : '');
    var chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = isSel;
    optEl.appendChild(chk);
    var label = document.createElement('span');
    label.textContent = opt;
    optEl.appendChild(label);
    optEl.addEventListener('click', function(e) {
      if (e.target !== chk) chk.checked = !chk.checked;
      var sel = filters[key] || [];
      if (chk.checked) {
        if (sel.indexOf(opt) === -1) sel.push(opt);
      } else {
        sel = sel.filter(function(v) { return v !== opt; });
      }
      filters[key] = sel;
      renderMultiSelect(wrapId, key, options);
      applyFilters();
    });
    wrap.appendChild(optEl);
  });
}

function parseTags(tags) {
  if (!tags) return [];
  var cleaned = tags.replace(/^\[|\]$/g, '');
  return cleaned.split(',').map(s => s.trim()).filter(Boolean);
}

// ============ 筛选逻辑 ============
// 多选：数组非空时，匹配其中任意一个值（OR 逻辑）
function getFilteredData() {
  return allData.filter(function(d) {
    if (filters.province.length && filters.province.indexOf(d.provinceShort) === -1) return false;
    if (filters.category.length && filters.category.indexOf(d.categoryName) === -1) return false;
    if (filters.level.length && filters.level.indexOf(d.level) === -1) return false;
    if (filters.admin.length && filters.admin.indexOf(d.adminType) === -1) return false;
    if (filters.tag.length) {
      var tags = parseTags(d.tags);
      var hit = filters.tag.some(function(t) { return tags.indexOf(t) !== -1; });
      if (!hit) return false;
    }
    if (filters.keyword && d.nameCn.indexOf(filters.keyword) === -1 && d.nameEn.toLowerCase().indexOf(filters.keyword.toLowerCase()) === -1) return false;
    return true;
  });
}

function applyFilters() {
  var data = getFilteredData();
  document.getElementById('statShown').textContent = data.length;
  document.getElementById('listCount').textContent = data.length;
  renderMap(data);
  renderBar(data);
  renderPie(data);
  renderTable(data);
}

function resetFilters() {
  filters = { province:[], category:[], level:[], admin:[], tag:[], keyword:'' };
  // 重建所有平铺多选选项（重置选项状态）
  Object.keys(MS_KEYS).forEach(function(id) {
    var key = MS_KEYS[id];
    renderMultiSelect(id, key, getOptionsFor(key));
  });
  document.getElementById('filterKeyword').value = '';
  applyFilters();
}

// 获取某筛选维度当前应展示的选项列表（用于重置）
function getOptionsFor(key) {
  if (key === 'province') return unique(allData.map(d => d.provinceShort)).filter(Boolean).sort();
  if (key === 'category') return unique(allData.map(d => d.categoryName)).filter(Boolean);
  if (key === 'level') return unique(allData.map(d => d.level)).filter(Boolean);
  if (key === 'admin') return unique(allData.map(d => d.adminType)).filter(Boolean);
  if (key === 'tag') {
    var tagSet = new Set();
    allData.forEach(d => {
      parseTags(d.tags).forEach(t => tagSet.add(t));
    });
    return Array.from(tagSet);
  }
  return [];
}

// ============ 中国地图 ============
function renderMap(data) {
  var provCount = {};
  data.forEach(function(d) {
    if (d.provinceShort) {
      provCount[d.provinceShort] = (provCount[d.provinceShort] || 0) + 1;
    }
  });
  var mapData = Object.keys(provCount).map(function(p) {
    return { name: p, value: provCount[p] };
  });

  mapChart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: function(params) {
        if (params.value) {
          return params.name + '：<b>' + params.value + '</b> 所高校';
        }
        return params.name + '：无数据';
      }
    },
    visualMap: {
      min: 0,
      max: Math.max.apply(null, mapData.map(d => d.value).concat([1])),
      left: 20, bottom: 20,
      text: ['多', '少'],
      calculable: true,
      inRange: { color: ['#e0f3ff', '#2a5298'] }
    },
    series: [{
      type: 'map',
      map: 'china',
      roam: true,
      label: { show: false },
      emphasis: {
        label: { show: true, color: '#333' },
        itemStyle: { areaColor: '#ffd666' }
      },
      itemStyle: {
        borderColor: '#fff',
        borderWidth: 1
      },
      data: mapData
    }]
  });

  // 点击省份筛选（切换该省份在下拉多选中的选中状态）
  mapChart.off('click');
  mapChart.on('click', function(params) {
    if (params.name && provCount[params.name]) {
      var sel = filters.province || [];
      if (sel.indexOf(params.name) === -1) {
        sel.push(params.name);
      } else {
        sel = sel.filter(function(v) { return v !== params.name; });
      }
      filters.province = sel;
      // 重新渲染省份多选选项
      renderMultiSelect('msProvince', 'province', getOptionsFor('province'));
      applyFilters();
    }
  });
}

// ============ 柱状图 ============
function renderBar(data) {
  var provCount = {};
  data.forEach(function(d) {
    if (d.provinceShort) provCount[d.provinceShort] = (provCount[d.provinceShort] || 0) + 1;
  });
  var sorted = Object.entries(provCount).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 10);
  barChart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 50, right: 20, top: 20, bottom: 30 },
    xAxis: {
      type: 'category',
      data: sorted.map(d => d[0]),
      axisLabel: { interval: 0, fontSize: 11 }
    },
    yAxis: { type: 'value', minInterval: 1 },
    series: [{
      type: 'bar',
      data: sorted.map(d => d[1]),
      itemStyle: { color: '#2a5298', borderRadius: [4,4,0,0] },
      barMaxWidth: 30
    }]
  });
}

// ============ 饼图 ============
function renderPie(data) {
  var catCount = {};
  data.forEach(function(d) {
    var c = d.categoryName || '未知';
    catCount[c] = (catCount[c] || 0) + 1;
  });
  var pieData = Object.entries(catCount).sort(function(a, b) { return b[1] - a[1]; });
  pieChart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}：{c} 所（{d}%）' },
    legend: { type: 'scroll', orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie',
      radius: ['35%', '70%'],
      center: ['40%', '50%'],
      data: pieData.map(d => ({ name: d[0], value: d[1] })),
      label: { show: false },
      emphasis: { label: { show: true, fontSize: 13, fontWeight: 'bold' } }
    }]
  });
}

// ============ 表格 ============
function renderTable(data) {
  var tbody = document.getElementById('univTableBody');
  tbody.innerHTML = '';
  data.forEach(function(d) {
    var tr = document.createElement('tr');
    tr.onclick = function() { showDetail(d); };
    tr.innerHTML =
      '<td><b>' + escapeHtml(d.nameCn) + '</b></td>' +
      '<td>' + escapeHtml(d.provinceShort) + '</td>' +
      '<td>' + escapeHtml(d.cityName) + '</td>' +
      '<td>' + escapeHtml(d.categoryName) + '</td>' +
      '<td>' + escapeHtml(d.level) + '</td>' +
      '<td>' + renderTags(d.tags) + '</td>';
    tbody.appendChild(tr);
  });
}

function renderTags(tags) {
  var list = parseTags(tags);
  if (list.length === 0) return '<span class="badge">—</span>';
  return list.map(function(t) {
    var cls = 'tag';
    if (t === '985') cls += ' tag-985';
    else if (t === '211') cls += ' tag-211';
    else if (t === '双一流') cls += ' tag-syl';
    return '<span class="' + cls + '">' + escapeHtml(t) + '</span>';
  }).join('');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

// ============ 详情弹窗 ============
function showDetail(d) {
  document.getElementById('mName').textContent = d.nameCn;
  document.getElementById('mEnName').textContent = d.nameEn || '';
  document.getElementById('mMeta').innerHTML =
    '<span class="badge">' + escapeHtml(d.provinceShort) + ' ' + escapeHtml(d.cityName) + '</span>' +
    '<span class="badge">' + escapeHtml(d.categoryName) + '</span>' +
    '<span class="badge">' + escapeHtml(d.level) + '</span>' +
    '<span class="badge">' + escapeHtml(d.adminType) + '</span>' +
    renderTags(d.tags);
  document.getElementById('mContact').innerHTML =
    (d.phone ? '<span>📞 ' + escapeHtml(d.phone) + '</span>' : '') +
    (d.email ? '<span>✉️ ' + escapeHtml(d.email) + '</span>' : '') +
    (d.publishedAt ? '<span>📅 更新于 ' + escapeHtml(d.publishedAt) + '</span>' : '');
  document.getElementById('mInds').textContent = formatInds(d.inds);
  document.getElementById('mReason').textContent = formatReason(d.reason);
  document.getElementById('modalOverlay').classList.add('show');
}

function formatReason(reason) {
  if (!reason) return '暂无学校介绍';
  // 将 | 分隔符转换为换行，使介绍更易读
  return reason.split('|').join('\n\n');
}

function formatInds(inds) {
  if (!inds) return '暂无校园环境数据';
  // 将 ; 分隔的不同类别转换为换行
  return inds.split(';').join('\n');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// 启动
init();
</script>
