<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国高校数据可视化平台</title>
<!-- ECharts CDN -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
  }
  .header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .header .stats {
    display: flex; gap: 30px; text-align: center;
  }
  .header .stats .num { font-size: 26px; font-weight: 700; }
  .header .stats .label { font-size: 12px; opacity: 0.85; }

  .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }

  /* 筛选器 */
  .filter-bar {
    background: #fff;
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .filter-row {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;
  }
  .filter-item { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .filter-item label {
    font-size: 13px; color: #666; font-weight: 600;
  }
  .filter-item input {
    padding: 8px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 6px;
    font-size: 14px;
    min-width: 200px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  .filter-item input:focus {
    border-color: #2a5298;
  }
  /* 下拉多选组件 */
  .ms-dropdown { position: relative; }
  .ms-trigger {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 150px; padding: 8px 12px;
    border: 1px solid #d9d9d9; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px;
    -webkit-user-select: none; user-select: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ms-trigger:hover { border-color: #2a5298; }
  .ms-dropdown.ms-open .ms-trigger {
    border-color: #2a5298;
    box-shadow: 0 0 0 2px rgba(42,82,152,0.15);
  }
  .ms-trigger-label { color: #666; font-weight: 600; }
  .ms-trigger-count { color: #2a5298; font-weight: 600; margin-left: auto; }
  .ms-caret { color: #999; transition: transform 0.2s; }
  .ms-dropdown.ms-open .ms-caret { transform: rotate(180deg); }
  .ms-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 100;
    min-width: 230px; max-width: 320px;
    background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    display: none; flex-direction: column; overflow: hidden;
  }
  .ms-dropdown.ms-open .ms-panel { display: flex; }
  .ms-search {
    border: none; border-bottom: 1px solid #f0f0f0;
    padding: 10px 12px; font-size: 13px; outline: none;
  }
  .ms-search:focus { background: #fafbff; }
  .ms-panel-list { max-height: 260px; overflow-y: auto; padding: 6px; }
  .ms-opt {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 5px;
    font-size: 13px; color: #444; cursor: pointer;
    -webkit-user-select: none; user-select: none; white-space: nowrap;
  }
  .ms-opt:hover { background: #f5f8ff; color: #2a5298; }
  .ms-opt input[type="checkbox"] {
    width: 14px; height: 14px; min-width: 14px;
    margin: 0; cursor: pointer; flex-shrink: 0;
    accent-color: #2a5298;
  }
  .ms-opt.ms-checked { color: #2a5298; font-weight: 600; }
  /* 顶部"全选"行 */
  .ms-all-row {
    border-bottom: 1px solid #f0f0f0;
    margin-bottom: 4px;
    border-radius: 5px;
    color: #2a5298;
    font-weight: 600;
  }
  .ms-all-row.ms-checked { background: #f0f5ff; }
  .ms-empty { padding: 10px; font-size: 13px; color: #999; text-align: center; }
  /* 省份-城市树形 */
  .ms-prov { font-weight: 400; }
  .ms-arrow { color: #999; font-size: 11px; transition: transform 0.15s; width: 14px; flex-shrink: 0; }
  .ms-arrow-open { transform: rotate(90deg); }
  .ms-arrow-none { visibility: hidden; }
  .ms-prov-label { flex: 1; }
  .ms-prov-badge { color: #2a5298; font-size: 11px; background: #eef3ff; border-radius: 4px; padding: 1px 6px; }
  .ms-city { padding-left: 20px; font-weight: 400; color: #444; }
  .ms-indent { color: #bbb; width: 12px; flex-shrink: 0; font-size: 11px; }
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn-primary { background: #2a5298; color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-reset { background: #f0f0f0; color: #555; }
  .btn-reset:hover { background: #e0e0e0; }
  .filter-actions { display: flex; gap: 10px; margin-left: auto; }

  /* 图表区域 */
  .charts-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card h3 {
    font-size: 16px; color: #1e3c72;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0f0f0;
  }
  #mapChart { width: 100%; height: 520px; }
  #barChart { width: 100%; height: 320px; }
  #pieChart { width: 100%; height: 250px; }

  /* 列表 */
  .list-card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .list-header h3 { font-size: 16px; color: #1e3c72; }
  .list-header .count { font-size: 13px; color: #888; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f7f8fa;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    color: #555;
    border-bottom: 2px solid #e8e8e8;
    position: sticky; top: 0;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    vertical-align: middle;
  }
  tbody tr:hover { background: #f5f8ff; cursor: pointer; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-right: 4px;
    background: #e6f0ff;
    color: #2a5298;
  }
  .tag-985 { background: #fff1e6; color: #d46b08; }
  .tag-211 { background: #e6fffb; color: #08979c; }
  .tag-syl { background: #f9f0ff; color: #722ed1; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    background: #f0f0f0;
    color: #555;
  }
  .list-wrapper { max-height: 600px; overflow-y: auto; }

  /* 详情弹窗 */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 90%;
    max-width: 760px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 28px;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .modal-close {
    position: absolute; top: 14px; right: 18px;
    font-size: 24px; cursor: pointer; color: #999;
    background: none; border: none;
  }
  .modal-close:hover { color: #333; }
  .modal h2 { font-size: 22px; color: #1e3c72; margin-bottom: 4px; }
  .modal .en-name { color: #888; font-size: 14px; margin-bottom: 14px; }
  .modal .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .modal .meta .badge { font-size: 13px; padding: 4px 10px; }
  .modal .section { margin-bottom: 16px; }
  .modal .section h4 {
    font-size: 15px; color: #2a5298;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid #f0f0f0;
  }
  .modal .section p { font-size: 14px; line-height: 1.8; color: #444; white-space: pre-wrap; }
  .modal .contact { font-size: 14px; color: #555; line-height: 1.9; }
  .modal .contact span { margin-right: 20px; }
  .ranking-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .ranking-summary .rank-stat {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .rank-stat .rank-stat-label { color: #777; font-size: 12px; }
  .rank-stat .rank-stat-value { color: #1e3c72; font-size: 22px; font-weight: 700; margin-top: 4px; }
  .rank-list { display: grid; gap: 8px; }
  .rank-item { padding: 8px 10px; background: #f7f8fa; border-radius: 6px; font-size: 13px; }
  .rank-item strong { color: #1e3c72; margin-right: 8px; }
  .rank-muted { color: #999; }
  .rank-badge { background: #fff7e6; color: #d46b08; }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .ranking-summary { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 12px; text-align: center; }
    .filter-actions { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎓 中国高校数据可视化平台</h1>
  </div>
  <div class="stats">
    <div><div class="num" id="statTotal">0</div><div class="label">高校总数</div></div>
    <div><div class="num" id="statProv">0</div><div class="label">覆盖省份</div></div>
    <div><div class="num" id="statShown">0</div><div class="label">当前显示</div></div>
  </div>
</div>

<div class="container ranking-summary" id="rankingSummary">
  <div class="rank-stat"><div class="rank-stat-label">中国大学排名覆盖</div><div class="rank-stat-value" id="rankStatBcur">0</div></div>
  <div class="rank-stat"><div class="rank-stat-label">中国高职院校排名覆盖</div><div class="rank-stat-value" id="rankStatBcvcr">0</div></div>
  <div class="rank-stat"><div class="rank-stat-label">专业排名记录</div><div class="rank-stat-value" id="rankStatBcmr">0</div></div>
  <div class="rank-stat"><div class="rank-stat-label">学科排名记录</div><div class="rank-stat-value" id="rankStatBcsr">0</div></div>
</div>

<div class="container">
  <!-- 筛选器 -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-item">
        <label>省份 / 城市</label>
        <div class="ms-dropdown" id="msProvince"></div>
      </div>
      <div class="filter-item">
        <label>学科</label>
        <div class="ms-dropdown" id="msSubject"></div>
      </div>
      <div class="filter-item">
        <label>专业</label>
        <div class="ms-dropdown" id="msMajor"></div>
      </div>
      <div class="filter-item">
        <label>学科等级</label>
        <div class="ms-dropdown" id="msSubjectLevel"></div>
      </div>
      <div class="filter-item">
        <label>专业等级</label>
        <div class="ms-dropdown" id="msMajorGrade"></div>
      </div>
      <div class="filter-item">
        <label>学校类别</label>
        <div class="ms-dropdown" id="msCategory"></div>
      </div>
      <div class="filter-item">
        <label>层次</label>
        <div class="ms-dropdown" id="msLevel"></div>
      </div>
      <div class="filter-item">
        <label>主管部门</label>
        <div class="ms-dropdown" id="msAdmin"></div>
      </div>
      <div class="filter-item">
        <label>标签</label>
        <div class="ms-dropdown" id="msTag"></div>
      </div>
      <div class="filter-item">
        <label>关键词搜索</label>
        <input type="text" id="filterKeyword" placeholder="输入学校名称搜索...">
      </div>
      <div class="filter-actions">
        <button class="btn btn-reset" onclick="resetFilters()">重置</button>
      </div>
    </div>
  </div>

  <!-- 图表 -->
  <div class="charts-grid">
    <div class="card">
      <h3>🗺️ 各省高校数量分布</h3>
      <div id="mapChart"></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:20px;">
        <h3>📊 高校数量 Top 20 城市</h3>
        <div id="barChart"></div>
      </div>
      <div class="card">
        <h3>🥧 学校类别占比</h3>
        <div id="pieChart"></div>
      </div>
    </div>
  </div>

  <!-- 列表 -->
  <div class="list-card">
    <div class="list-header">
      <h3>🏫 高校列表</h3>
      <div class="count">共 <span id="listCount">0</span> 所</div>
    </div>
    <div class="list-wrapper">
      <table>
        <thead>
          <tr>
            <th>学校名称</th>
            <th>省份</th>
            <th>城市</th>
            <th>类别</th>
            <th>层次</th>
            <th>综合排名</th>
            <th>标签</th>
          </tr>
        </thead>
        <tbody id="univTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2 id="mName"></h2>
    <div class="en-name" id="mEnName"></div>
    <div class="meta" id="mMeta"></div>
    <div class="contact" id="mContact"></div>
    <div class="section">
      <h4>🏅 软科排名</h4>
      <div id="mRankings" class="rank-list"></div>
    </div>
    <div class="section">
      <h4>🏠 校园环境</h4>
      <p id="mInds"></p>
    </div>
    <div class="section">
      <h4>📖 学校介绍</h4>
      <p id="mReason"></p>
    </div>
  </div>
</div>

<script src="china_map.js"></script>
<script src="data.js"></script>
<script src="ranking_data.js"></script>
<script>
// ============ 全局状态 ============
var allData = UNIV_DATA || [];
var rankingData = typeof RANKING_DATA !== 'undefined' ? RANKING_DATA : {};
// 每个筛选维度对应一个数组（多选），空数组表示不筛选
// provinceCity 是树形：{ province: [省...], city: [部分选择的城市...], partial: [部分选择的省...] }
// 省在 province 但不在 partial = 该省全选（隐含选中其所有城市）
var filters = {
  provinceCity: { province: [], city: [], partial: [] },
  subject: [],
  major: [],
  '学科等级': [],
  '专业等级': [],
  category: [],
  level: [],
  admin: [],
  tag: [],
  keyword: ''
};
var mapChart, barChart, pieChart;
var RANK_FILTER_EXPANDED = { subject: {}, major: {} };

// 筛选维度配置：ms-wrap id -> filters 中的键名
var MS_KEYS = {
  msProvince: 'provinceCity',
  msSubject: 'subject',
  msMajor: 'major',
  msSubjectLevel: '学科等级',
  msMajorGrade: '专业等级',
  msCategory: 'category',
  msLevel: 'level',
  msAdmin: 'admin',
  msTag: 'tag'
};

// ============ 初始化 ============
function init() {
  // 设置下拉组件标签
  var labels = { msProvince: '省份 / 城市', msCategory: '学校类别', msLevel: '层次', msAdmin: '主管部门', msTag: '标签' };
  Object.keys(labels).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.dataset.label = labels[id];
  });

  // 构建下拉多选选项
  renderProvinceCity();
  renderRankFilter('msSubject', 'subject', RANKING_FILTER_TREE.subject || {});
  renderRankFilter('msMajor', 'major', RANKING_FILTER_TREE.major || {});
  renderMultiSelect('msSubjectLevel', '学科等级', rankingFilterOptions('bcsr', 'level'));
  renderMultiSelect('msMajorGrade', '专业等级', rankingFilterOptions('bcmr', 'grade'));
  renderMultiSelect('msCategory', 'category', unique(allData.map(d => d.categoryName)).filter(Boolean));
  renderMultiSelect('msLevel', 'level', unique(allData.map(d => d.level)).filter(Boolean));
  renderMultiSelect('msAdmin', 'admin', unique(allData.map(d => d.adminType)).filter(Boolean));

  // 标签选项（从 tags 字段解析）
  var tagSet = new Set();
  allData.forEach(d => {
    parseTags(d.tags).forEach(t => tagSet.add(t));
  });
  renderMultiSelect('msTag', 'tag', Array.from(tagSet));

  // 点击页面其它区域关闭所有下拉
  document.addEventListener('click', function() {
    document.querySelectorAll('.ms-dropdown.ms-open').forEach(function(d) {
      d.classList.remove('ms-open');
    });
  });

  document.getElementById('filterKeyword').addEventListener('input', function() {
    filters.keyword = this.value.trim();
    applyFilters();
  });

  // 注册中国地图（使用本地 GeoJSON，避免 CDN 失效）
  if (typeof CHINA_GEOJSON !== 'undefined') {
    echarts.registerMap('china', CHINA_GEOJSON);
  }

  // 初始化图表
  mapChart = echarts.init(document.getElementById('mapChart'));
  barChart = echarts.init(document.getElementById('barChart'));
  pieChart = echarts.init(document.getElementById('pieChart'));
  window.addEventListener('resize', function() {
    mapChart.resize(); barChart.resize(); pieChart.resize();
  });

  // 统计头部
  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statProv').textContent = unique(allData.map(d => d.provinceShort)).filter(Boolean).length;

  applyFilters();
}

function unique(arr) { return Array.from(new Set(arr)); }

// ============ 省份-城市树形数据 ============
// 构建 { 省份: [城市...] } 的树结构，且记录每省高校数
function buildProvinceCityTree() {
  var tree = {};
  allData.forEach(function(d) {
    if (!d.provinceShort) return;
    if (!tree[d.provinceShort]) tree[d.provinceShort] = { cities: {}, count: 0 };
    tree[d.provinceShort].count++;
    if (d.cityName) {
      if (!tree[d.provinceShort].cities[d.cityName]) tree[d.provinceShort].cities[d.cityName] = 0;
      tree[d.provinceShort].cities[d.cityName]++;
    }
  });
  return tree;
}
var PROVINCE_TREE = null;

// 渲染省份-城市树形下拉（唯一一个"一个框选省又选市"的组件）
// 记录用户手动展开的省份（点击箭头/文字时切换），勾选省份不会自动展开城市
var PROVINCE_EXPANDED = {};
// 直辖市：不显示城市子行（城市=省本身）
var MUNICIPALITIES = { '北京': 1, '上海': 1, '天津': 1, '重庆': 1 };

function renderProvinceCity() {
  if (!PROVINCE_TREE) PROVINCE_TREE = buildProvinceCityTree();
  var wrap = document.getElementById('msProvince');
  if (!wrap) return;
  var pc = filters.provinceCity;
  var isOpen = wrap.classList.contains('ms-open');

  // 省份数组按高校数量降序
  var provs = Object.keys(PROVINCE_TREE).sort(function(a, b) {
    return PROVINCE_TREE[b].count - PROVINCE_TREE[a].count;
  });

  wrap.innerHTML = '';

  // --- 触发按钮 ---
  var trigger = document.createElement('div');
  trigger.className = 'ms-trigger';
  var label = document.createElement('span');
  label.className = 'ms-trigger-label';
  label.textContent = '省份 / 城市';
  var count = document.createElement('span');
  count.className = 'ms-trigger-count';
  count.textContent = selectedSummary(pc);
  var caret = document.createElement('span');
  caret.className = 'ms-caret';
  caret.textContent = '▾';
  trigger.appendChild(label);
  trigger.appendChild(count);
  trigger.appendChild(caret);
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpening = !wrap.classList.contains('ms-open');
    document.querySelectorAll('.ms-dropdown.ms-open').forEach(function(d) {
      if (d !== wrap) d.classList.remove('ms-open');
    });
    wrap.classList.toggle('ms-open', isOpening);
  });
  wrap.appendChild(trigger);

  // --- 面板 ---
  var panel = document.createElement('div');
  panel.className = 'ms-panel';
  panel.style.minWidth = '260px';
  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  var search = document.createElement('input');
  search.className = 'ms-search';
  search.type = 'text';
  search.placeholder = '搜索省份或城市...';
  search.addEventListener('input', function() {
    renderTree(search.value.trim());
  });
  panel.appendChild(search);

  var list = document.createElement('div');
  list.className = 'ms-panel-list';
  panel.appendChild(list);

  wrap.appendChild(panel);

  // 已选摘要
  function selectedSummary(pc) {
    var p = (pc.province || []).length;
    var c = (pc.city || []).length;
    if (p === 0 && c === 0) return '全部';
    if (p > 0) return '已选 ' + p + ' 省';
    return '已选 ' + c + ' 城';
  }

  // 渲染树：kw 为搜索词
  function renderTree(kw) {
    list.innerHTML = '';
    var totalP = 0, totalC = 0;
    var pcNow = filters.provinceCity;

    // 顶部"全选"行（全选所有省份，各市全选；点击不展开城市）
    var allSel = pcNow.province.length === provs.length;
    var allRow = document.createElement('div');
    allRow.className = 'ms-opt ms-all-row' + (allSel ? ' ms-checked' : '');
    var allChk = document.createElement('input');
    allChk.type = 'checkbox';
    allChk.checked = allSel;
    allRow.appendChild(allChk);
    var allSpan = document.createElement('span');
    allSpan.textContent = '全选';
    allRow.appendChild(allSpan);
    allRow.addEventListener('click', function(e) {
      if (e.target !== allChk) allChk.checked = !allChk.checked;
      filters.provinceCity = allChk.checked ? { province: provs.slice(), city: [], partial: [] } : { province: [], city: [], partial: [] };
      PROVINCE_EXPANDED = {}; // 全选/清空后不展开任何省份城市
      renderProvinceCity();
      // 保持当前展开/折叠状态，不自动展开城市
      applyFilters();
    });
    list.appendChild(allRow);

    provs.forEach(function(p) {
      var node = PROVINCE_TREE[p];
      var cityNames = Object.keys(node.cities).sort(function(a, b) { return node.cities[b] - node.cities[a]; });
      // 搜索：省名或城市名命中才显示
      var pMatch = !kw || p.indexOf(kw) !== -1;
      var cMatch = cityNames.filter(function(c) { return c.indexOf(kw) !== -1; });
      if (!pMatch && cMatch.length === 0) return;

      var isProvSel = pcNow.province.indexOf(p) !== -1;
      var isMunicipal = !!MUNICIPALITIES[p]; // 直辖市不展开城市
      var isExpanded = (!isMunicipal) && (!!PROVINCE_EXPANDED[p] || !!kw); // 只有手动展开或搜索时才展开，勾选省不自动展开
      // 全选判断：省选中且不在 partial 中 = 该省全选所有城市
      var isPartial = pcNow.partial.indexOf(p) !== -1;
      var allCitiesSel = isProvSel && !isPartial;
      var someCitiesSel = isProvSel && isPartial;
      // 搜索时只显示命中的城市
      var shownCities = kw ? cMatch : cityNames;

      // --- 省份行 ---
      var provRow = document.createElement('div');
      provRow.className = 'ms-opt ms-prov' + (isProvSel ? ' ms-checked' : '');
      var arrow = document.createElement('span');
      arrow.className = 'ms-arrow' + (isExpanded ? ' ms-arrow-open' : '') + (isMunicipal ? ' ms-arrow-none' : '');
      arrow.textContent = isMunicipal ? '' : '▸';
      var pchk = document.createElement('input');
      pchk.type = 'checkbox';
      pchk.checked = isProvSel;
      var pLabel = document.createElement('span');
      pLabel.className = 'ms-prov-label';
      pLabel.textContent = p;
      var pBadge = document.createElement('span');
      pBadge.className = 'ms-prov-badge';
      pBadge.textContent = isProvSel ? (allCitiesSel ? '全部城市' : '部分城市') : '';
      provRow.appendChild(arrow);
      provRow.appendChild(pchk);
      provRow.appendChild(pLabel);
      provRow.appendChild(pBadge);
      // 点击省份行：勾选省（默认全选该省所有城市）或展开/收起
      provRow.addEventListener('click', function(e) {
        if (e.target === arrow || e.target === pLabel || e.target === pBadge || e.target.classList.contains('ms-prov-label') || e.target.classList.contains('ms-prov-badge')) {
          // 点击文字/箭头：切换展开（直辖市不可展开）
          if (isMunicipal) return;
          isExpanded = !isExpanded;
          if (isExpanded) PROVINCE_EXPANDED[p] = true;
          else delete PROVINCE_EXPANDED[p];
          renderTree(search.value.trim());
          return;
        }
        // 点击复选框：切换省份选中
        var selProv = pcNow.province.slice();
        var selCity = pcNow.city.slice();
        var selPartial = pcNow.partial.slice();
        if (selProv.indexOf(p) === -1) {
          selProv.push(p);
          // 默认全选该省所有城市（不记录城市、不进 partial）
        } else {
          selProv = selProv.filter(function(v) { return v !== p; });
          // 取消省时也移除该省的城市和 partial 状态
          selCity = selCity.filter(function(c) { return cityNames.indexOf(c) === -1; });
          selPartial = selPartial.filter(function(v) { return v !== p; });
        }
        filters.provinceCity = { province: selProv, city: selCity, partial: selPartial };
        renderProvinceCity();
        applyFilters();
      });
      list.appendChild(provRow);

      // --- 城市子行（选中省份时展开） ---
      if (isExpanded) {
        // 该省城市的"全选"行（勾选 = 该省全选所有城市）
        var cityAllRow = document.createElement('div');
        cityAllRow.className = 'ms-opt ms-city ms-all-row' + (allCitiesSel ? ' ms-checked' : '');
        var cityAllIndent = document.createElement('span');
        cityAllIndent.className = 'ms-indent';
        cityAllIndent.textContent = '—';
        var cityAllChk = document.createElement('input');
        cityAllChk.type = 'checkbox';
        cityAllChk.checked = allCitiesSel;
        cityAllRow.appendChild(cityAllIndent);
        cityAllRow.appendChild(cityAllChk);
        var cityAllSpan = document.createElement('span');
        cityAllSpan.textContent = '全选';
        cityAllRow.appendChild(cityAllSpan);
        cityAllRow.addEventListener('click', function(e) {
          if (e.target !== cityAllChk) cityAllChk.checked = !cityAllChk.checked;
          var selProv2 = pcNow.province.slice();
          var selCity2 = pcNow.city.slice();
          var selPartial2 = pcNow.partial.slice();
          if (cityAllChk.checked) {
            // 全选该省所有城市（确保省已选中）
            if (selProv2.indexOf(p) === -1) selProv2.push(p);
            selCity2 = selCity2.filter(function(cn) { return cityNames.indexOf(cn) === -1; });
            selPartial2 = selPartial2.filter(function(v) { return v !== p; });
          } else {
            // 取消全选 = 该省所有城市不选，同时取消省份勾选
            selProv2 = selProv2.filter(function(v) { return v !== p; });
            selCity2 = selCity2.filter(function(cn) { return cityNames.indexOf(cn) === -1; });
            selPartial2 = selPartial2.filter(function(v) { return v !== p; });
          }
          filters.provinceCity = { province: selProv2, city: selCity2, partial: selPartial2 };
          renderProvinceCity();
          applyFilters();
        });
        list.appendChild(cityAllRow);

        shownCities.forEach(function(c) {
          // 该省全选时城市全部勾选；部分选择时按 city 数组判断
          var isCSel = isProvSel && (allCitiesSel || pcNow.city.indexOf(c) !== -1);
          var cRow = document.createElement('div');
          cRow.className = 'ms-opt ms-city' + (isCSel ? ' ms-checked' : '');
          var indent = document.createElement('span');
          indent.className = 'ms-indent';
          indent.textContent = '—';
          var cchk = document.createElement('input');
          cchk.type = 'checkbox';
          cchk.checked = isCSel;
          var cLabel = document.createElement('span');
          cLabel.textContent = c;
          cRow.appendChild(indent);
          cRow.appendChild(cchk);
          cRow.appendChild(cLabel);
          cRow.addEventListener('click', function(e) {
            var selProv2 = pcNow.province.slice();
            var selCity2 = pcNow.city.slice();
            var selPartial2 = pcNow.partial.slice();
            var isProvSelected = selProv2.indexOf(p) !== -1;
            var isPartialNow = selPartial2.indexOf(p) !== -1;
            // 当前城市是否选中
            var curSel = isProvSelected && (isPartialNow ? selCity2.indexOf(c) !== -1 : true);
            var isChecked = !curSel;
            if (isChecked) {
              // 勾选城市：确保省份已选中
              if (!isProvSelected) selProv2.push(p);
              if (isPartialNow) {
                // 已在部分选择状态，直接加入该城市
                if (selCity2.indexOf(c) === -1) selCity2.push(c);
                // 若该省所有城市都选上了，恢复全选
                if (cityNames.every(function(cn) { return selCity2.indexOf(cn) !== -1; })) {
                  selCity2 = selCity2.filter(function(cn) { return cityNames.indexOf(cn) === -1; });
                  selPartial2 = selPartial2.filter(function(v) { return v !== p; });
                }
              } else if (isProvSelected) {
                // 全选状态下勾选某城市无变化（本来就全选）
              } else {
                // 省份未选中：勾选单个城市 -> 省份进入部分选择状态，仅该城市生效
                selPartial2.push(p);
                if (selCity2.indexOf(c) === -1) selCity2.push(c);
              }
            } else {
              // 取消城市
              if (isPartialNow) {
                selCity2 = selCity2.filter(function(v) { return v !== c; });
                // 若该省城市被清空，则整个省份取消选择
                if (!cityNames.some(function(cn) { return selCity2.indexOf(cn) !== -1; })) {
                  selPartial2 = selPartial2.filter(function(v) { return v !== p; });
                  selProv2 = selProv2.filter(function(v) { return v !== p; });
                }
              } else {
                // 全选状态取消某城市 -> 进入部分选择，city 记录除它以外的所有城市
                selPartial2.push(p);
                cityNames.forEach(function(cn) {
                  if (cn !== c && selCity2.indexOf(cn) === -1) selCity2.push(cn);
                });
              }
            }
            filters.provinceCity = { province: selProv2, city: selCity2, partial: selPartial2 };
            renderProvinceCity();
            applyFilters();
          });
          list.appendChild(cRow);
        });
      }
    });

    // 无匹配
    if (list.children.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'ms-empty';
      empty.textContent = '无匹配选项';
      list.appendChild(empty);
    }
  }

  renderTree('');
  if (isOpen) wrap.classList.add('ms-open');
}

// ============ 下拉多选组件 ============
// 渲染一个下拉复选框：触发按钮显示已选数量，展开面板支持搜索 + 多选
function renderMultiSelect(wrapId, key, options) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  var selected = filters[key] || [];
  var isOpen = wrap.classList.contains('ms-open');

  wrap.innerHTML = '';

  // --- 触发按钮 ---
  var trigger = document.createElement('div');
  trigger.className = 'ms-trigger';
  var label = document.createElement('span');
  label.className = 'ms-trigger-label';
  label.textContent = wrap.dataset.label || key;
  var count = document.createElement('span');
  count.className = 'ms-trigger-count';
  count.textContent = selected.length ? '已选 ' + selected.length : '全部';
  var caret = document.createElement('span');
  caret.className = 'ms-caret';
  caret.textContent = '▾';
  trigger.appendChild(label);
  trigger.appendChild(count);
  trigger.appendChild(caret);
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpening = !wrap.classList.contains('ms-open');
    // 关闭其它下拉
    document.querySelectorAll('.ms-dropdown.ms-open').forEach(function(d) {
      if (d !== wrap) d.classList.remove('ms-open');
    });
    wrap.classList.toggle('ms-open', isOpening);
    if (isOpening) {
      var search = wrap.querySelector('.ms-search');
      if (search) { search.value = ''; search.focus(); }
      filterOptions(wrap, key, options);
    }
  });
  wrap.appendChild(trigger);

  // --- 面板 ---
  var panel = document.createElement('div');
  panel.className = 'ms-panel';
  panel.addEventListener('click', function(e) { e.stopPropagation(); });

  var search = document.createElement('input');
  search.className = 'ms-search';
  search.type = 'text';
  search.placeholder = '搜索...';
  search.addEventListener('input', function() {
    filterOptions(wrap, key, options);
  });
  panel.appendChild(search);

  var list = document.createElement('div');
  list.className = 'ms-panel-list';
  panel.appendChild(list);

  wrap.appendChild(panel);

  function filterOptions() {
    var selected = filters[key] || [];
    var kw = search.value.trim();
    var listEl = wrap.querySelector('.ms-panel-list');
    listEl.innerHTML = '';
    var shown = options.filter(function(o) { return !kw || o.indexOf(kw) !== -1; });
    // 顶部"全选"行
    var isAllSelected = options.length > 0 && selected.length === options.length;
    var allRow = document.createElement('div');
    allRow.className = 'ms-opt ms-all-row' + (isAllSelected ? ' ms-checked' : '');
    var allChk = document.createElement('input');
    allChk.type = 'checkbox';
    allChk.checked = isAllSelected;
    allRow.appendChild(allChk);
    var allSpan = document.createElement('span');
    allSpan.textContent = '全选';
    allRow.appendChild(allSpan);
    allRow.addEventListener('click', function(e) {
      if (e.target !== allChk) allChk.checked = !allChk.checked;
      filters[key] = allChk.checked ? options.slice() : [];
      renderMultiSelect(wrapId, key, options);
      applyFilters();
    });
    listEl.appendChild(allRow);
    if (shown.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'ms-empty';
      empty.textContent = '无匹配选项';
      listEl.appendChild(empty);
    } else {
      shown.forEach(function(opt) {
        var isSel = selected.indexOf(opt) !== -1;
        var optEl = document.createElement('div');
        optEl.className = 'ms-opt' + (isSel ? ' ms-checked' : '');
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = isSel;
        optEl.appendChild(chk);
        var span = document.createElement('span');
        span.textContent = opt;
        optEl.appendChild(span);
        optEl.addEventListener('click', function(e) {
          if (e.target !== chk) chk.checked = !chk.checked;
          var sel = filters[key] || [];
          if (chk.checked) {
            if (sel.indexOf(opt) === -1) sel.push(opt);
          } else {
            sel = sel.filter(function(v) { return v !== opt; });
          }
          filters[key] = sel;
          renderMultiSelect(wrapId, key, options);
          // 重新展开并聚焦搜索框；不要重复调用旧闭包的 filterOptions()
          wrap.classList.add('ms-open');
          var s = wrap.querySelector('.ms-search');
          if (s) { s.value = kw; s.focus(); }
          applyFilters();
        });
        listEl.appendChild(optEl);
      });
    }
    // 更新计数
    var fc = wrap.querySelector('.ms-count');
    if (fc) fc.textContent = '已选 ' + selected.length + ' / ' + options.length;
  }

  filterOptions();
  if (isOpen) wrap.classList.add('ms-open');
}

function renderRankFilter(wrapId, key, codeNames) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  var isOpen = wrap.classList.contains('ms-open');
  wrap.innerHTML = '';

  var trigger = document.createElement('div');
  trigger.className = 'ms-trigger';
  trigger.innerHTML = '<span class="ms-trigger-label">' + (key === 'subject' ? '学科' : '专业') + '</span><span class="ms-trigger-count"></span><span class="ms-caret">▾</span>';
  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var opening = !wrap.classList.contains('ms-open');
    document.querySelectorAll('.ms-dropdown.ms-open').forEach(function(d) { if (d !== wrap) d.classList.remove('ms-open'); });
    wrap.classList.toggle('ms-open', opening);
  });
  wrap.appendChild(trigger);

  var panel = document.createElement('div');
  panel.className = 'ms-panel';
  panel.addEventListener('click', function(e) { e.stopPropagation(); });
  var search = document.createElement('input');
  search.className = 'ms-search';
  search.placeholder = key === 'subject' ? '搜索学科...' : '搜索专业...';
  panel.appendChild(search);
  var list = document.createElement('div');
  list.className = 'ms-panel-list';
  panel.appendChild(list);
  wrap.appendChild(panel);

  function childrenOf(code) {
    return Object.keys(codeNames).filter(function(child) {
      return child.length > code.length && child.indexOf(code) === 0 && child.length === code.length + (key === 'subject' ? 2 : 2);
    }).sort();
  }

  function leavesOf(code) {
    var descendants = Object.keys(codeNames).filter(function(child) {
      return child.indexOf(code) === 0 && child.length > code.length;
    });
    return descendants.filter(function(child) { return childrenOf(child).length === 0; });
  }

  function branchMatches(code, kw) {
    if (!kw) return true;
    if (codeNames[code].indexOf(kw) !== -1) return true;
    return childrenOf(code).some(function(child) { return branchMatches(child, kw); });
  }

  function render() {
    var selected = filters[key] || [];
    var kw = search.value.trim();
    list.innerHTML = '';
    trigger.querySelector('.ms-trigger-count').textContent = selected.length ? '已选 ' + selected.length : '全部';
    var allLeaves = Object.keys(codeNames).filter(function(code) { return childrenOf(code).length === 0; });
    var allSelected = allLeaves.length > 0 && allLeaves.every(function(code) { return selected.indexOf(code) !== -1; });
    var allRow = document.createElement('div');
    allRow.className = 'ms-opt ms-all-row' + (allSelected ? ' ms-checked' : '');
    var allCheckbox = document.createElement('input');
    allCheckbox.type = 'checkbox'; allCheckbox.checked = allSelected;
    allRow.appendChild(allCheckbox);
    var allLabel = document.createElement('span'); allLabel.textContent = '全选'; allRow.appendChild(allLabel);
    allRow.addEventListener('click', function(e) {
      if (e.target !== allCheckbox) allCheckbox.checked = !allCheckbox.checked;
      filters[key] = allCheckbox.checked ? allLeaves.slice() : [];
      RANK_FILTER_EXPANDED[key] = {};
      renderRankFilter(wrapId, key, codeNames);
      applyFilters();
    });
    list.appendChild(allRow);
    var roots = Object.keys(codeNames).filter(function(code) {
      return code.length === 2 && branchMatches(code, kw);
    }).sort();
    roots.forEach(function(root) { renderNode(root, 0, kw); });
    if (!list.children.length) {
      var empty = document.createElement('div');
      empty.className = 'ms-empty'; empty.textContent = '无匹配选项'; list.appendChild(empty);
    }
  }

  function renderNode(code, level, kw) {
    var selected = filters[key] || [];
    var name = codeNames[code];
    var descendants = childrenOf(code);
    var match = branchMatches(code, kw);
    if (!match) return;
    var leaves = descendants.length ? leavesOf(code) : [code];
    var selectedCount = leaves.filter(function(leaf) { return selected.indexOf(leaf) !== -1; }).length;
    var isSelected = leaves.length > 0 && selectedCount === leaves.length;
    var isPartial = selectedCount > 0 && !isSelected;
    var expanded = !!kw || !!RANK_FILTER_EXPANDED[key][code];
    var row = document.createElement('div');
    row.className = 'ms-opt' + (isSelected ? ' ms-checked' : '');
    row.style.paddingLeft = (8 + level * 18) + 'px';
    var arrow = document.createElement('span');
    arrow.className = 'ms-arrow' + (expanded ? ' ms-arrow-open' : '') + (descendants.length ? '' : ' ms-arrow-none');
    arrow.textContent = descendants.length ? '▸' : '';
    row.appendChild(arrow);
    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.checked = isSelected; checkbox.indeterminate = isPartial;
    row.appendChild(checkbox);
    var label = document.createElement('span');
    label.className = 'ms-prov-label';
    label.textContent = code + ' ' + name;
    row.appendChild(label);
    var badge = document.createElement('span');
    badge.className = 'ms-prov-badge';
    badge.textContent = isPartial ? '部分选择' : '';
    row.appendChild(badge);
    row.addEventListener('click', function(e) {
      if (e.target === arrow || e.target === label || e.target === badge) {
        if (descendants.length) {
          RANK_FILTER_EXPANDED[key][code] = !expanded;
          render();
        }
        return;
      }
      var next = (filters[key] || []).filter(function(value) { return leaves.indexOf(value) === -1; });
      if (!isSelected) {
        leaves.forEach(function(leaf) {
          if (next.indexOf(leaf) === -1) next.push(leaf);
        });
      } else {
        // 取消父级或叶子时，移除该节点覆盖的全部叶子
      }
      filters[key] = next;
      renderRankFilter(wrapId, key, codeNames);
      wrap.classList.add('ms-open');
      var newSearch = wrap.querySelector('.ms-search');
      if (newSearch) { newSearch.value = kw; newSearch.focus(); }
      applyFilters();
    });
    list.appendChild(row);
    if (expanded) descendants.forEach(function(child) { renderNode(child, level + 1, kw); });
  }

  search.addEventListener('input', render);
  render();
  if (isOpen) wrap.classList.add('ms-open');
}

function parseTags(tags) {
  if (!tags) return [];
  var cleaned = tags.replace(/^\[|\]$/g, '');
  return cleaned.split(',').map(s => s.trim()).filter(Boolean);
}

// ============ 筛选逻辑 ============
// 多选：数组非空时，匹配其中任意一个值（OR 逻辑）
function getFilteredData() {
  return allData.filter(function(d) {
    var pc = filters.provinceCity;
    if (pc.province.length) {
      if (pc.province.indexOf(d.provinceShort) === -1) return false;
      // 该省处于部分选择时，城市须匹配；否则（全选）匹配该省所有城市
      if (pc.partial.indexOf(d.provinceShort) !== -1 && pc.city.indexOf(d.cityName) === -1) return false;
    }
    if (!matchesRankingFilter(d, 'subject', filters.subject)) return false;
    if (!matchesRankingFilter(d, 'major', filters.major)) return false;
    if (!matchesRankingValueFilter(d, 'bcsr', 'level', filters['学科等级'])) return false;
    if (!matchesRankingValueFilter(d, 'bcmr', 'grade', filters['专业等级'])) return false;
    if (filters.category.length && filters.category.indexOf(d.categoryName) === -1) return false;
    if (filters.level.length && filters.level.indexOf(d.level) === -1) return false;
    if (filters.admin.length && filters.admin.indexOf(d.adminType) === -1) return false;
    if (filters.tag.length) {
      var tags = parseTags(d.tags);
      var hit = filters.tag.some(function(t) { return tags.indexOf(t) !== -1; });
      if (!hit) return false;
    }
    if (filters.keyword && d.nameCn.indexOf(filters.keyword) === -1 && d.nameEn.toLowerCase().indexOf(filters.keyword.toLowerCase()) === -1) return false;
    return true;
  });
}

function matchesRankingFilter(d, type, selectedCodes) {
  if (!selectedCodes.length) return true;
  var ranking = getRanking(d);
  var records = ranking[type === 'subject' ? 'bcsr' : 'bcmr'] || [];
  return selectedCodes.some(function(code) {
    return records.some(function(item) { return item.code && item.code.indexOf(code) === 0; });
  });
}

function rankingFilterOptions(type, field) {
  var values = [];
  Object.keys(rankingData).forEach(function(key) {
    (rankingData[key][type] || []).forEach(function(item) {
      if (item[field] && values.indexOf(item[field]) === -1) values.push(item[field]);
    });
  });
  return values.sort(function(a, b) { return a.localeCompare(b, 'zh-CN', { numeric: true }); });
}

function matchesRankingValueFilter(d, type, field, selectedValues) {
  if (!selectedValues.length) return true;
  var ranking = getRanking(d);
  var records = ranking[type] || [];
  return selectedValues.some(function(value) {
    return records.some(function(item) { return item[field] === value; });
  });
}

function applyFilters() {
  var data = getFilteredData();
  document.getElementById('statShown').textContent = data.length;
  document.getElementById('listCount').textContent = data.length;
  renderMap(data);
  renderBar(data);
  renderPie(data);
  renderTable(data);
  renderRankingStats(data);
}

function resetFilters() {
  filters = { provinceCity: { province: [], city: [], partial: [] }, subject: [], major: [], '学科等级': [], '专业等级': [], category: [], level: [], admin: [], tag: [], keyword: '' };
  PROVINCE_EXPANDED = {}; // 重置省份展开状态
  RANK_FILTER_EXPANDED = { subject: {}, major: {} };
  // 重建所有下拉选项（重置选项状态）
  Object.keys(MS_KEYS).forEach(function(id) {
    var key = MS_KEYS[id];
    if (key === 'provinceCity') renderProvinceCity();
    else if (key === 'subject' || key === 'major') renderRankFilter(id, key, RANKING_FILTER_TREE[key] || {});
    else if (key === '学科等级') renderMultiSelect(id, key, rankingFilterOptions('bcsr', 'level'));
    else if (key === '专业等级') renderMultiSelect(id, key, rankingFilterOptions('bcmr', 'grade'));
    else renderMultiSelect(id, key, getOptionsFor(key));
  });
  document.getElementById('filterKeyword').value = '';
  applyFilters();
}

// 获取某筛选维度当前应展示的选项列表（用于重置）
function getOptionsFor(key) {
  if (key === 'provinceCity') return [];
  if (key === 'category') return unique(allData.map(d => d.categoryName)).filter(Boolean);
  if (key === 'level') return unique(allData.map(d => d.level)).filter(Boolean);
  if (key === 'admin') return unique(allData.map(d => d.adminType)).filter(Boolean);
  if (key === 'tag') {
    var tagSet = new Set();
    allData.forEach(d => {
      parseTags(d.tags).forEach(t => tagSet.add(t));
    });
    return Array.from(tagSet);
  }
  if (key === '学科等级') return rankingFilterOptions('bcsr', 'level');
  if (key === '专业等级') return rankingFilterOptions('bcmr', 'grade');
  return [];
}

// ============ 中国地图 ============
function renderMap(data) {
  var provCount = {};
  data.forEach(function(d) {
    if (d.provinceShort) {
      provCount[d.provinceShort] = (provCount[d.provinceShort] || 0) + 1;
    }
  });
  var allProvinces = PROVINCE_TREE ? Object.keys(PROVINCE_TREE) : unique(allData.map(function(d) { return d.provinceShort; })).filter(Boolean);
  var mapData = allProvinces.map(function(p) {
    return { name: p, value: provCount[p] || 0 };
  });

  mapChart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: function(params) {
        if (params.value) {
          return params.name + '：<b>' + params.value + '</b> 所高校';
        }
        return params.name + '：无数据';
      }
    },
    visualMap: {
      min: 0,
      max: Math.max.apply(null, mapData.map(d => d.value).concat([1])),
      left: 20, bottom: 20,
      text: ['多', '少'],
      calculable: true,
      inRange: { color: ['#e0f3ff', '#2a5298'] }
    },
    series: [{
      type: 'map',
      map: 'china',
      roam: false,
      label: { show: false },
      emphasis: {
        label: { show: true, color: '#333' },
        itemStyle: { areaColor: '#ffd666' }
      },
      itemStyle: {
        borderColor: '#fff',
        borderWidth: 1
      },
      data: mapData
    }]
  });

  // 点击省份筛选（切换该省份在树形下拉中的选中状态）
  mapChart.off('click');
  mapChart.on('click', function(params) {
    if (params.name && allProvinces.indexOf(params.name) !== -1) {
      var pc = filters.provinceCity;
      var selProv = pc.province.slice();
      var selCity = pc.city.slice();
      var selPartial = pc.partial.slice();
      var cityNames = PROVINCE_TREE && PROVINCE_TREE[params.name] ? Object.keys(PROVINCE_TREE[params.name].cities) : [];
      if (selProv.indexOf(params.name) === -1) {
        selProv.push(params.name);
        // 默认全选该省所有城市（不记录城市、不进 partial）
      } else {
        selProv = selProv.filter(function(v) { return v !== params.name; });
        selCity = selCity.filter(function(c) { return cityNames.indexOf(c) === -1; });
        selPartial = selPartial.filter(function(v) { return v !== params.name; });
      }
      filters.provinceCity = { province: selProv, city: selCity, partial: selPartial };
      // 重新渲染树形下拉
      renderProvinceCity();
      applyFilters();
    }
  });
}

// ============ 柱状图 ============
function renderBar(data) {
  var cityCount = {};
  data.forEach(function(d) {
    if (d.cityName) cityCount[d.cityName] = (cityCount[d.cityName] || 0) + 1;
  });
  var sorted = Object.entries(cityCount).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 20);
  barChart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 50, right: 20, top: 20, bottom: 60 },
    xAxis: {
      type: 'category',
      data: sorted.map(d => d[0]),
      axisLabel: { interval: 0, fontSize: 11, rotate: 45 }
    },
    yAxis: { type: 'value', minInterval: 1 },
    series: [{
      type: 'bar',
      data: sorted.map(d => d[1]),
      itemStyle: { color: '#2a5298', borderRadius: [4,4,0,0] },
      barMaxWidth: 30
    }]
  });
}

// ============ 饼图 ============
function renderPie(data) {
  var catCount = {};
  data.forEach(function(d) {
    var c = d.categoryName || '未知';
    catCount[c] = (catCount[c] || 0) + 1;
  });
  var pieData = Object.entries(catCount).sort(function(a, b) { return b[1] - a[1]; });
  pieChart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}：{c} 所（{d}%）' },
    legend: { type: 'scroll', orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie',
      radius: ['35%', '70%'],
      center: ['40%', '50%'],
      data: pieData.map(d => ({ name: d[0], value: d[1] })),
      label: { show: false },
      emphasis: { label: { show: true, fontSize: 13, fontWeight: 'bold' } }
    }]
  });
}

function getRanking(d) {
  var key = d.univCode || d.nameCn;
  return rankingData[key] || {};
}

function formatRank(rank) {
  return rank ? '第' + escapeHtml(rank) + '名' : '—';
}

function renderRankingStats(data) {
  var bcur = 0, bcvcr = 0, bcmr = 0, bcsr = 0;
  data.forEach(function(d) {
    var ranking = getRanking(d);
    if (ranking.bcur) bcur++;
    if (ranking.bcvcr) bcvcr++;
    bcmr += (ranking.bcmr || []).length;
    bcsr += (ranking.bcsr || []).length;
  });
  document.getElementById('rankStatBcur').textContent = bcur;
  document.getElementById('rankStatBcvcr').textContent = bcvcr;
  document.getElementById('rankStatBcmr').textContent = bcmr;
  document.getElementById('rankStatBcsr').textContent = bcsr;
}

// ============ 表格 ============
function renderTable(data) {
  var tbody = document.getElementById('univTableBody');
  tbody.innerHTML = '';
  data.forEach(function(d) {
    var tr = document.createElement('tr');
    tr.onclick = function() { showDetail(d); };
    tr.innerHTML =
      '<td><b>' + escapeHtml(d.nameCn) + '</b></td>' +
      '<td>' + escapeHtml(d.provinceShort) + '</td>' +
      '<td>' + escapeHtml(d.cityName) + '</td>' +
      '<td>' + escapeHtml(d.categoryName) + '</td>' +
      '<td>' + escapeHtml(d.level) + '</td>' +
      '<td>' + renderOverallRank(d) + '</td>' +
      '<td>' + renderTags(d.tags) + '</td>';
    tbody.appendChild(tr);
  });
}

function renderOverallRank(d) {
  var ranking = getRanking(d);
  var item = ranking.bcur || ranking.bcvcr;
  if (!item) return '<span class="badge">—</span>';
  return '<span class="badge rank-badge">' + escapeHtml(item.title) + ' ' + formatRank(item.rank) + '</span>';
}

function renderTags(tags) {
  var list = parseTags(tags);
  if (list.length === 0) return '<span class="badge">—</span>';
  return list.map(function(t) {
    var cls = 'tag';
    if (t === '985') cls += ' tag-985';
    else if (t === '211') cls += ' tag-211';
    else if (t === '双一流') cls += ' tag-syl';
    return '<span class="' + cls + '">' + escapeHtml(t) + '</span>';
  }).join('');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

// ============ 详情弹窗 ============
function showDetail(d) {
  document.getElementById('mName').textContent = d.nameCn;
  document.getElementById('mEnName').textContent = d.nameEn || '';
  document.getElementById('mMeta').innerHTML =
    '<span class="badge">' + escapeHtml(d.provinceShort) + ' ' + escapeHtml(d.cityName) + '</span>' +
    '<span class="badge">' + escapeHtml(d.categoryName) + '</span>' +
    '<span class="badge">' + escapeHtml(d.level) + '</span>' +
    '<span class="badge">' + escapeHtml(d.adminType) + '</span>' +
    renderTags(d.tags);
  document.getElementById('mContact').innerHTML =
    (d.phone ? '<span>📞 ' + escapeHtml(d.phone) + '</span>' : '') +
    (d.email ? '<span>✉️ ' + escapeHtml(d.email) + '</span>' : '') +
    (d.publishedAt ? '<span>📅 更新于 ' + escapeHtml(d.publishedAt) + '</span>' : '');
  renderDetailRankings(d);
  document.getElementById('mInds').textContent = formatInds(d.inds);
  document.getElementById('mReason').textContent = formatReason(d.reason);
  document.getElementById('modalOverlay').classList.add('show');
}

function renderDetailRankings(d) {
  var ranking = getRanking(d);
  var items = [];
  if (ranking.bcur) {
    items.push('<div class="rank-item"><strong>' + escapeHtml(ranking.bcur.title) + '</strong>' + formatRank(ranking.bcur.rank) + (ranking.bcur.score ? ' · 得分 ' + escapeHtml(ranking.bcur.score) : '') + '</div>');
  }
  if (ranking.bcvcr) {
    items.push('<div class="rank-item"><strong>' + escapeHtml(ranking.bcvcr.title) + '</strong>' + formatRank(ranking.bcvcr.rank) + (ranking.bcvcr.score ? ' · 得分 ' + escapeHtml(ranking.bcvcr.score) : '') + '</div>');
  }
  (ranking.bcmr || []).forEach(function(item) {
    items.push('<div class="rank-item"><strong>专业 · ' + escapeHtml(item.title) + '</strong>' + formatRank(item.rank) + (item.grade ? ' · ' + escapeHtml(item.grade) : '') + '</div>');
  });
  (ranking.bcsr || []).forEach(function(item) {
    items.push('<div class="rank-item"><strong>学科 · ' + escapeHtml(item.title) + '</strong>' + formatRank(item.rank) + (item.level ? ' · ' + escapeHtml(item.level) : '') + '</div>');
  });
  document.getElementById('mRankings').innerHTML = items.length ? items.join('') : '<span class="rank-muted">暂无排名数据</span>';
}

function formatReason(reason) {
  if (!reason) return '暂无学校介绍';
  // 将 | 分隔符转换为换行，使介绍更易读
  return reason.split('|').join('\n\n');
}

function formatInds(inds) {
  if (!inds) return '暂无校园环境数据';
  // 将 ; 分隔符转换为换行，并去除每行首尾多余空格
  return inds.split(';').map(function (s) { return s.trim(); }).join('\n');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// 启动
init();
</script>
